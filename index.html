<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="description" content="현재 위치 주변 화장실을 거리순으로 찾아보세요.">
  <title>화장실 어디?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="top"><span class="mark" aria-hidden="true">⌖</span><div><p class="eyebrow">NEARBY RESTROOMS</p><h1>화장실 어디?</h1></div></header>
    <section class="hero">
      <div class="hero-copy"><p class="eyebrow light">내 주변 편의시설</p><h2>가까운 화장실을<br>빠르게 찾아요</h2><p>현재 위치를 기준으로 거리순으로 정렬합니다.</p></div>
      <div class="hero-icon" aria-hidden="true">⌂</div>
    </section>
    <section class="search-panel" aria-label="주변 화장실 검색">
      <label for="radius">검색 반경</label>
      <select id="radius"><option value="500">500 m</option><option value="1000" selected>1 km</option><option value="3000">3 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select>
      <button id="find" class="find"><span>⌖</span> 내 주변 화장실 찾기</button>
      <p id="status" class="status" role="status">먼저 주소를 좌표로 변환해야 거리 검색을 사용할 수 있어요.</p>
    </section>
    <section class="results-head"><div><p class="eyebrow">SEARCH RESULTS</p><h2>주변 화장실</h2></div><span id="count" class="count">0곳</span></section>
    <div id="results" class="results"></div>
    <footer>자료 출처: 제공된 공중화장실 CSV · 길찾기는 네이버 지도</footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
